[workspace]
members = [
    "crates/ui",
    "crates/ui-build",
    "crates/ui-cef-sys",
    "crates/ui-pack",
    "examples/embedded-app",
]
default-members = ["crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/tensorai-co/ui"
homepage = "https://github.com/tensorai-co/ui"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "deny"
todo = "deny"
