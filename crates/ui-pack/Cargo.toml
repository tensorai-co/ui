[package]
name = "ui-pack"
description = "Packaging and the dev loop for ui apps: packages through packager, `run` and `gen-ts`"
keywords = ["packaging", "installer", "desktop", "webview"]
categories = ["development-tools"]
default-run = "ui-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
packager = { git = "https://github.com/tensorai-co/packager" }

[[bin]]
name = "ui-pack"
path = "src/main.rs"

[[bin]]
name = "cargo-ui"
path = "src/bin/cargo-ui.rs"
