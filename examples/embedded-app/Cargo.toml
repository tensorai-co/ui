[package]
name = "embedded-app"
description = "Example: a ui app with its web build embedded by ui-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Packaging, read by packager (`ui-pack pack`).
[package.metadata.packager.app]
name = "Embedded App"
identifier = "dev.ui.embedded-app"
url_schemes = ["uiembedded"]
file_types = [{ extension = "uidoc", name = "Embedded App document" }]

[package.metadata.packager.package.app]

[dependencies]
ui = { path = "../../crates/ui" }

[build-dependencies]
ui-build = { path = "../../crates/ui-build" }

[lints]
workspace = true

[[test]]
name = "live"
harness = false
