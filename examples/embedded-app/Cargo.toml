[package]
name = "embedded-app"
description = "Example: a ui app with its web build embedded by ui-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.ui]
name = "Embedded App"
bundle_id = "dev.ui.embedded-app"
url_schemes = ["uiembedded"]
document_types = ["uidoc"]

[dependencies]
ui = { path = "../../crates/ui" }

[build-dependencies]
ui-build = { path = "../../crates/ui-build" }

[lints]
workspace = true

[[test]]
name = "live"
harness = false
